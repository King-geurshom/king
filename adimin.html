<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | Geurshom Service</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #222;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background: #0a3d62;
      color: white;
    }
    button {
      padding: 6px 10px;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    .vip {
      background: green;
      color: white;
    }
    .logout {
      background: red;
      color: white;
      float: right;
    }
  </style>
</head>

<body>

<button class="logout" onclick="logout()">Logout</button>

<h1>👑 Admin Dashboard</h1>
<h2>📤 Upload Movie (Admin Only)</h2>
<input type="text" id="movieTitle" placeholder="Izina rya filime">
<input type="text" id="movieGenre" placeholder="Genre (Action/Drama/Series)">
<input type="text" id="movieDriveId" placeholder="Google Drive FILE ID">
<button onclick="uploadMovie()">Upload</button>

<table>
  <thead>
    <tr>
      <th>Email</th>
      <th>VIP</th>
      <th>VIP Until</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="usersTable"></tbody>
</table>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/***********************
 * FIREBASE CONFIG
 ***********************/
const firebaseConfig = {
  apiKey: "API_KEY",
  authDomain: "PROJECT_ID.firebaseapp.com",
  projectId: "PROJECT_ID",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAIL = "umwamiking2500@gmail.com";
const ONE_WEEK = 7 * 24 * 60 * 60 * 1000;

/***********************
 * AUTH CHECK
 ***********************/
auth.onAuthStateChanged(user => {
  if (!user || user.email !== ADMIN_EMAIL) {
    alert("Nturi admin ❌");
    window.location.href = "index.html";
  } else {
    loadUsers();
  }
});

/***********************
 * LOAD USERS
 ***********************/
async function loadUsers() {
  const table = document.getElementById("usersTable");
  table.innerHTML = "";

  const snapshot = await db.collection("users").get();
  snapshot.forEach(doc => {
    const data = doc.data();

    const vipStatus =
      data.vipUntil && Date.now() < data.vipUntil ? "YES" : "NO";

    const vipUntil = data.vipUntil
      ? new Date(data.vipUntil).toLocaleDateString()
      : "-";

    table.innerHTML += `
      <tr>
        <td>${doc.id}</td>
        <td>${vipStatus}</td>
        <td>${vipUntil}</td>
        <td>
          <button class="vip" onclick="makeVIP('${doc.id}')">
            Make VIP (7 days)
          </button>
        </td>
      </tr>
    `;
  });
}

/***********************
 * MAKE USER VIP
 ***********************/
async function makeVIP(uid) {
  await db.collection("users").doc(uid).update({
    vip: true,
    vipUntil: Date.now() + ONE_WEEK
  });
  alert("User yabaye VIP 💎");
  loadUsers();
}

/***********************
 * LOGOUT
 ***********************/
function logout() {
  auth.signOut().then(() => {
    window.location.href = "index.html";
  });
}
</script
  async function uploadMovie() {
  const title = document.getElementById("movieTitle").value.trim();
  const genre = document.getElementById("movieGenre").value.trim();
  const driveId = document.getElementById("movieDriveId").value.trim();

  if(!title || !genre || !driveId){
    alert("Andika title, genre na drive ID");
    return;
  }

  // Random movie ID
  const movieId = "movie_" + Date.now();

  await db.collection("movies").doc(movieId).set({
    title,
    genre,
    driveId,
    uploadedAt: Date.now()
  });

  alert("Firime yashyizweho neza ✅");
  loadMoviesTable(); // optional: refresh list yerekana movie nshya
}


</body>
</html>
